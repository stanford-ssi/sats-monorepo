name: Format

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: clang-format's output drifts between major versions, so an
      # unpinned one would fail on code that is correctly formatted locally.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The same script as `bazel run //:format -- --check`, so there is
      # one definition of formatted rather than one here and one locally.
      - name: Check formatting
        run: ./tools/format.sh --check
