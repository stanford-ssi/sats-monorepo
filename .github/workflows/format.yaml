name: Format

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clang-format and ruff are both pinned in uv.lock, so CI runs the
      # exact versions a local `uv sync` installs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The same script as `bazelisk run //:format -- --check`, so there is
      # one definition of formatted rather than one here and one locally.
      - name: Check formatting
        run: ./tools/format.sh --check
