[project]
name = "sats-monorepo"
version = "0.1.0"
description = "Monorepo for SSI satellites"
readme = "README.md"
authors = [
    { name = "Carson Lauer", email = "lauercarson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio-tools>=1.83.1",
    "protobuf>=7.36.1",
    "pyelftools>=0.33",
    "pyserial>=3.5",
]

[project.scripts]
sats-monorepo = "sats_monorepo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
# The ground scripts are the only python in the tree; keep pytest out of
# bazel-bin and friends.
testpaths = ["scripts"]

[tool.ruff]
# 88 is ruff's default and the code already sits close to it; the C++ side
# is at 80 because embedded code is read in narrower splits.
line-length = 88
# So that `import cobs` and friends are sorted as first party, not third.
src = ["scripts", "src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # outdated idioms
    "B",   # bugbear: likely mistakes rather than style
]

[tool.ruff.lint.per-file-ignores]
# Test files deliberately import modules under test at odd angles.
"scripts/tests/*" = ["E402"]
