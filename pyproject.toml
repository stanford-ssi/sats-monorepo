[project]
name = "sats-monorepo"
version = "0.1.0"
description = "Monorepo for SSI satellites"
readme = "README.md"
authors = [
    { name = "Carson Lauer", email = "lauercarson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sats-monorepo = "sats_monorepo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "arda",
    "clang-format==18.1.8",
    "satcmd",
]

[tool.uv.sources]
arda = { workspace = true }
satcmd = { workspace = true }

[tool.uv.workspace]
members = ["sim", "ground"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "sim/arda", "sim/scenarios", "sim/ssift"]
python_files = ["*.py"]

[tool.ruff]
# 88 is ruff's default and the code already sits close to it; the C++ side
# is at 80 because embedded code is read in narrower splits.
line-length = 88
# So that `import satcmd` and friends are sorted as first party, not third.
src = ["ground", "sim", "src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # outdated idioms
    "B",   # bugbear: likely mistakes rather than style
]

[tool.ruff.lint.per-file-ignores]
# Test files deliberately import modules under test at odd angles.
"ground/tests/*" = ["E402"]
