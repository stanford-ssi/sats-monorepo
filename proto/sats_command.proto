syntax = "proto3";

/**
 * The SatCmd protocol: peek and poke another node's memory by byte offset.
 *
 * It is symmetric. Either end of a link may send requests (READ, WRITE) and
 * either end may answer them (READ_RESPONSE, WRITE_RESPONSE), so the same
 * message travels ground to flight, flight to ground, or between two
 * microcontrollers sharing a line.
 *
 * There is deliberately no notion of type. A value is just `width` raw
 * bytes, little endian, carried in the low bytes of `value`. Whoever sends
 * a request knows what the bytes mean (the ground reads it from the elf's
 * debug info); whoever answers it only copies bytes, so it needs no per
 * type code at all.
 */

enum SatMsgType {
  SAT_MSG_TYPE_UNSPECIFIED = 0; // never sent, so no valid message is empty
  SAT_MSG_TYPE_READ = 1;
  SAT_MSG_TYPE_WRITE = 2;
  SAT_MSG_TYPE_READ_RESPONSE = 3;
  SAT_MSG_TYPE_WRITE_RESPONSE = 4;
}

/*
 * Bytes addressed. Each value is its own byte count, so once a width is
 * known to be one of these it can be used as a length directly. proto3
 * enums are open, so anything else can still arrive and is refused with
 * STATUS_BAD_WIDTH.
 */
enum Width {
  WIDTH_UNSPECIFIED = 0;
  WIDTH_1_BYTE = 1;
  WIDTH_2_BYTES = 2;
  WIDTH_4_BYTES = 4;
  WIDTH_8_BYTES = 8;
}

enum Status {
  STATUS_OK = 0;
  STATUS_BAD_ADDRESS = 1; // out of bounds, or misaligned for the width
  STATUS_BAD_WIDTH = 2;   // not one of the Width values
}

message SatMsg {
  SatMsgType type = 1;

  /* Byte offset into the answering node's memory. Echoed in the response,
     along with width, so a response can be matched to its request. */
  uint32 offset = 2;

  Width width = 3;

  /*
   * The raw bytes, little endian, in the low `width` bytes. A WRITE carries
   * what to store; both responses carry what the memory holds afterwards,
   * so a write is confirmed rather than assumed. Unused by a READ.
   */
  uint64 value = 4;

  /* Set on responses only. A failed request leaves memory untouched. */
  Status status = 5;
}
