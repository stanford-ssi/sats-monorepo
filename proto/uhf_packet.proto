syntax = "proto3";

/**
 * 433 MHz (UHF) link between the satellite and the ground station.
 *
 * These messages are the on-air format: flight software encodes and decodes
 * them with nanopb, the ground with protobuf. Uplink is ground -> satellite
 * (the spec's TX), Downlink is satellite -> ground (the spec's RX).
 *
 * Sources: Ground Station Specification Sheet, section 1, which describes
 * SAMWISE's older fixed-layout frame; SAMWISE's beacon_task.c and
 * adcs_packet.h for the beacon; and src/tasks/ftp/README.md in
 * samwise-flight-software for FTP. "spec:" comments record a size or range
 * from those layouts that still bounds the value. Fields marked INFERRED
 * have a type or meaning the sources do not state outright.
 */
package sats.uhf;

import "proto/sats_command.proto";

/* Node codes used in src and dst. */
enum NodeAddress {
  NODE_ADDRESS_UNSPECIFIED = 0;
  NODE_ADDRESS_SAMWISE = 128;
  NODE_ADDRESS_GROUND_STATION = 129;
  NODE_ADDRESS_BROADCAST = 255;  // "Anyone (*)"
  // TODO: radio repeat code is TBD in the spec.
}

/**
 * Fields common to every UHF packet in both directions. Protobuf has no
 * inheritance, so Uplink and Downlink hold one of these as a field.
 *
 * dst, src, flags and seq are what the RadioHead driver puts in its own
 * 4 byte header. If flight software keeps that driver, drop them here rather
 * than send them twice.
 */
message Frame {
  NodeAddress dst = 1;
  NodeAddress src = 2;
  uint32 flags = 3;       // spec: u8, set by the RadioHead driver, mostly ignorable
  uint32 seq = 4;         // spec: u8, wraps at 256; catches reordering and duplicates
  uint32 boot_count = 5;  // satellite reboot count, required by law
  uint32 msg_id = 6;      // INFERRED: in the spec's frame diagram (u32) but never described
}

/* ---------------------------------------------------------------------------
 * Downlink: satellite -> ground station
 * ------------------------------------------------------------------------ */

/**
 * Device status flags in the beacon, from SAMWISE's get_device_status().
 * SAMWISE packs these into one byte, bit 0 first; here a false flag costs
 * nothing on the wire and a true one costs two bytes.
 */
message BeaconStatus {
  bool rbf_detected = 1;        // remove-before-flight pin present
  bool fixed_solar_charge = 2;
  bool fixed_solar_fault = 3;
  bool panel_a_deployed = 4;
  bool panel_b_deployed = 5;
  bool payload_on = 6;
  bool adcs_on = 7;
  bool adcs_telem_valid = 8;    // whether the adcs block below can be trusted
}

/**
 * ADCS telemetry, from SAMWISE's adcs_packet_t. The spec's beacon diagram
 * shows only w, the quaternion, state and boot_count; the struct the beacon
 * actually copies has every field below.
 */
message BeaconAdcs {
  float w = 1;              // angular velocity
  float q0 = 2;             // attitude estimate quaternion
  float q1 = 3;
  float q2 = 4;
  float q3 = 5;
  uint32 state = 6;         // spec: one char
  uint32 boot_count = 7;
  float mjd = 8;            // modified Julian date
  float utc_time = 9;
  float voltage = 10;       // INFERRED: units not given
  float current = 11;       // INFERRED: units not given
  float sun_body_x = 12;    // sun sensor, body frame
  float sun_body_y = 13;
  float sun_body_z = 14;
  float mag_body_x = 15;    // magnetometer, body frame
  float mag_body_y = 16;
  float mag_body_z = 17;
  float lon = 18;
  float lat = 19;
  float alt = 20;           // INFERRED: units not given
}

/* Sent by the satellite every 5000 ms. */
message Beacon {
  string state_name = 1;             // e.g. "running"
  string call_to_action = 2;         // " beat cal!"
  uint32 reboot_counter = 3;
  uint64 time_in_state_ms = 4;
  uint32 rx_bytes = 5;
  uint32 rx_packets = 6;
  uint32 rx_backpressure_drops = 7;
  uint32 rx_bad_packet_drops = 8;
  uint32 tx_bytes = 9;
  uint32 tx_packets = 10;
  uint32 battery_voltage_mv = 11;    // spec: u16
  uint32 battery_current_ma = 12;    // spec: u16, unsigned in SAMWISE
  uint32 solar_voltage_mv = 13;      // spec: u16, legacy alias of panel A
  uint32 solar_current_ma = 14;      // spec: u16, legacy alias of panel A
  uint32 panel_a_voltage_mv = 15;    // spec: u16
  uint32 panel_a_current_ma = 16;    // spec: u16
  uint32 panel_b_voltage_mv = 17;    // spec: u16
  uint32 panel_b_current_ma = 18;    // spec: u16
  BeaconStatus status = 19;
  BeaconAdcs adcs = 20;
  string callsign = 21;              // spec: 6 chars; "KC3WNY" in the spec, "TEMPCS" in SAMWISE's code
}

/* ---------------------------------------------------------------------------
 * FTP: write-only file upload to the satellite's filesystem
 *
 * Files are named by two bytes and sent in cycles of up to 256 packets; the
 * satellite reports which packets of a cycle arrived and checks the whole
 * file's CRC32 at the end. See src/tasks/ftp/README.md.
 * ------------------------------------------------------------------------ */

/* Begin uploading a file. Answered with FTP_RESULT_READY_RECEIVE. */
message FtpStartFileWrite {
  uint32 fname = 1;      // spec: u16
  /* INFERRED: u32. The README's command body says u16, but its packet
     diagram, design notes and 13,434,880 byte max file length need 32 bits. */
  uint32 file_len = 2;
  fixed32 file_crc = 3;  // CRC32 of the whole file
}

/* One packet of file data. Must fall inside the current cycle's range. */
message FtpWriteToFile {
  uint32 fname = 1;      // spec: u16
  uint32 packet_id = 2;  // spec: u16
  bytes data = 3;        // spec: up to 205 bytes
}

message FtpCancelFileWrite {
  uint32 fname = 1;      // spec: u16
}

/* Wipe and reformat the filesystem. Destructive. */
message FtpReformat {}

message FtpRemoveFile {
  uint32 fname = 1;      // spec: u16; not yet implemented in SAMWISE
}

message FtpCommand {
  oneof command {
    FtpStartFileWrite start_file_write = 1;
    FtpWriteToFile write_to_file = 2;
    FtpCancelFileWrite cancel_file_write = 3;
    FtpReformat reformat = 4;
    FtpRemoveFile remove_file = 5;
  }
}

/**
 * Result codes, numbered as in the FTP README so they match flight software.
 * Negative values cost 10 bytes on the wire, but only error replies use them.
 */
enum FtpResult {
  FTP_RESULT_UNSPECIFIED = 0;
  FTP_RESULT_REFORMAT_SUCCESS = 1;
  FTP_RESULT_READY_RECEIVE = 10;
  FTP_RESULT_FILE_WRITE_SUCCESS = 11;      // cycle complete, next range follows
  FTP_RESULT_EOF_SUCCESS = 20;             // whole file received, CRC matches
  FTP_RESULT_CANCEL_SUCCESS = 30;
  FTP_RESULT_STATUS_REPORT = 40;           // periodic, every 5 s during a transfer
  FTP_RESULT_REMOVE_SUCCESS = 60;          // INFERRED: named in the README but given no value
  FTP_RESULT_REFORMAT_ERROR = -1;
  FTP_RESULT_FILESYS_INIT_ERROR = -2;
  FTP_RESULT_FILE_WRITE_BUFFER_ERROR = -11;
  FTP_RESULT_FILE_WRITE_MRAM_ERROR = -12;
  FTP_RESULT_PACKET_OUT_OF_RANGE = -13;
  FTP_RESULT_EOF_CRC_ERROR = -20;
  FTP_RESULT_CANCEL_ERROR = -30;
  FTP_RESULT_START_FILE_WRITE_ERROR = -50;
  FTP_RESULT_ALREADY_WRITING_FILE = -51;
  FTP_RESULT_NOT_WRITING_FILE = -52;
  FTP_RESULT_REMOVE_ERROR = -60;           // INFERRED: named in the README but given no value
  FTP_RESULT_ERROR = -99;
}

/* Packet range of the next cycle and what has arrived so far. Sent with
   READY_RECEIVE (INFERRED), FILE_WRITE_SUCCESS and PACKET_OUT_OF_RANGE. */
message FtpCycleStatus {
  uint32 packet_start = 1;      // spec: u16, inclusive
  uint32 packet_end = 2;        // spec: u16, inclusive
  bytes received_bitfield = 3;  // spec: 32 bytes, bit set = packet received
}

/* Sent with STATUS_REPORT. Fields follow the README's FTP_STATUS_REPORT_DATA
   struct, which differs slightly from its prose description. */
message FtpStatusReport {
  uint32 packet_start = 1;          // spec: u16, inclusive
  uint32 packet_end = 2;            // spec: u16, inclusive
  bytes received_bitfield = 3;      // spec: 32 bytes
  fixed32 file_crc_so_far = 4;      // 0 before the first cycle is written
  uint32 total_bytes_written = 5;
  bool filesys_buffer_malloced = 6;
  bool filesys_is_writing_file = 7;
}

/* Sent with EOF_SUCCESS and EOF_CRC_ERROR; both values are computed on disk. */
message FtpEof {
  fixed32 computed_crc = 1;
  uint32 file_len = 2;
}

/* Sent when a filesystem or LittleFS call caused the failure. */
message FtpFilesysError {
  sint32 filesys_error = 1;
  sint32 lfs_error = 2;    // LFS_ERR_OK if the error came only from Filesys
  sint32 blocks_left = 3;  // only for START_FILE_WRITE_ERROR, -1 if not computed
}

message FtpResponse {
  /* The transfer in progress, as given at start (not computed). With no
     transfer running: fname is "XX" as two ASCII bytes, the rest 0. */
  uint32 fname = 1;      // spec: u16
  uint32 file_len = 2;
  fixed32 file_crc = 3;
  FtpResult result = 4;
  oneof detail {
    FtpCycleStatus cycle_status = 5;
    FtpStatusReport status_report = 6;
    FtpEof eof = 7;
    FtpFilesysError filesys_error = 8;
  }
}

message Downlink {
  Frame frame = 1;
  oneof payload {
    Beacon beacon = 2;
    /* Reply to an uplinked command; replaces the spec's
       "Number of commands processed: %d" text response. */
    SatResponse sat_response = 3;
    FtpResponse ftp = 4;
  }
}

/* ---------------------------------------------------------------------------
 * Uplink: ground station -> satellite
 * ------------------------------------------------------------------------ */

/* Liveness check, answered with a SatResponse carrying STATUS_OK. */
message Ping {}

/* Power the payload up or down. Either could become a SatCmd bool write if
   flight software polls a payload enable field in the slate. */
message PayloadTurnOn {}
message PayloadTurnOff {}

/* Behaviour still being planned in samwise-flight-software#313. */
message PayloadShutdown {}

/**
 * INFERRED: the spec sends the state as a string. An enum is smaller and only
 * lets known states be sent. Names are SAMWISE's; check them against the new
 * flight software's state machine.
 */
enum SatState {
  SAT_STATE_UNSPECIFIED = 0;
  SAT_STATE_RUNNING = 1;          // "running_state"
  SAT_STATE_INIT = 2;             // "init_state"
  SAT_STATE_BURN_WIRE = 3;        // "burn_wire"
  SAT_STATE_BURN_WIRE_RESET = 4;  // "burn_wire_reset_state"
}

/* Force the satellite into a state. A command rather than a slate write,
   since entering a state like burn wire has side effects. */
message ManualStateOverride {
  SatState state = 1;
}

/**
 * Forward a command to the payload over UART. The satellite rebuilds the
 * payload's JSON string ["command_name", [args], {kwargs}] from these.
 */
message PayloadExec {
  string command_name = 1;  // a key of NAMES_TO_COMMANDS in payload/commands.py
  string args_json = 2;     // INFERRED: JSON array, kept as text since args are untyped
  string kwargs_json = 3;   // INFERRED: JSON object, kept as text since kwargs are untyped
}

/**
 * One byte relayed by picubed to the ADCS board. The spec lists this under
 * RX, but it is sent from the ground, so it is modelled as an uplink.
 */
message AdcsCommand {
  uint32 command = 1;  // spec: 0 to 127
}

message Uplink {
  Frame frame = 1;
  /* HMAC-SHA256 (32 bytes), checked by the satellite.
     TODO: decide exactly which bytes it covers. Protobuf encoding is not
     canonical, so it cannot be "re-encode this message without the hmac";
     the satellite must verify over the bytes it actually received. */
  bytes hmac = 2;
  oneof command {
    /* Read or write a slate field by offset; see sats_command.proto. */
    SatCmd sat_cmd = 3;
    Ping ping = 4;
    ManualStateOverride manual_state_override = 5;
    PayloadTurnOn payload_turn_on = 6;
    PayloadTurnOff payload_turn_off = 7;
    PayloadShutdown payload_shutdown = 8;
    PayloadExec payload_exec = 9;
    AdcsCommand adcs_command = 10;
    FtpCommand ftp = 11;
  }
  // The ADCS file packet is unimplemented and its format (JSON/YAML) undecided.
}
