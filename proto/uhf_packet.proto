syntax = "proto3";

/**
 * 433 MHz (UHF) link between SAMWISE and the ground station.
 *
 * Source: Ground Station Specification Sheet, section 1. Naming follows that
 * doc: RX is SAMWISE -> ground station, TX is ground station -> SAMWISE.
 *
 * These messages are the decoded form of a packet, not its byte layout. The
 * on-air frame is a fixed-width struct parsed on the Dell controller; the
 * "wire:" comments record the width each field has there. Fields marked
 * INFERRED have a type or meaning the spec does not state outright.
 */
package sats.uhf;

/* Node codes used in src and dst. */
enum Address {
  ADDRESS_UNSPECIFIED = 0;
  ADDRESS_SAMWISE = 128;
  ADDRESS_GROUND_STATION = 129;
  ADDRESS_BROADCAST = 255; // "Anyone (*)"
  // TODO: radio repeat code is TBD in the spec.
}

/**
 * Fields common to every UHF frame in both directions. Protobuf has no
 * inheritance, so RxPacket and TxPacket hold one of these as a field.
 */
message AbstractPacket {
  Address dst = 1;        // wire: u8
  Address src = 2;        // wire: u8
  uint32 flags = 3;       // wire: u8, set by the RadioHead driver, mostly ignorable
  uint32 seq = 4;         // wire: u8, increments per packet to catch reordering and duplicates
  uint32 len = 5;         // wire: u8, number of valid bytes in data
  bytes data = 6;         // wire: 210 bytes, raw and undecoded, kept for logging
  uint32 boot_count = 7;  // wire: u32, satellite reboot count, required by law
  uint32 msg_id = 8;      // INFERRED: in the frame diagram (u32) but never described in the text
}

/* ---------------------------------------------------------------------------
 * RX: SAMWISE -> ground station
 * ------------------------------------------------------------------------ */

/* Packed status byte in the beacon. Wire: one u8, one flag per bit. */
message BeaconStatus {
  bool rbf = 1;            // INFERRED: remove-before-flight pin
  bool charge = 2;         // INFERRED: battery charging
  bool fault = 3;          // INFERRED: charger/power fault
  bool panel_a = 4;        // INFERRED: "A" in the spec, taken as solar panel A
  bool panel_b = 5;        // INFERRED: "B" in the spec, taken as solar panel B
  bool payload = 6;        // INFERRED: payload powered
  bool adcs_on = 7;
  bool adcs_bit7 = 8;      // INFERRED: label is cut off in the spec diagram ("a..."); bit order also unconfirmed
}

/* ADCS telemetry carried in the beacon. */
message BeaconAdcs {
  float w = 1;             // wire: f32, INFERRED: angular rate
  float q0 = 2;            // wire: f32, attitude quaternion
  float q1 = 3;            // wire: f32
  float q2 = 4;            // wire: f32
  float q3 = 5;            // wire: f32
  uint32 state = 6;        // wire: u8
  uint32 boot_count = 7;   // wire: u32
}

/* Sent by SAMWISE every 5000 ms. */
message Beacon {
  string state_name = 1;             // wire: 9 bytes, null terminated, e.g. "running"
  string call_to_action = 2;         // wire: 10 bytes, null terminated
  uint32 reboot_counter = 3;         // wire: u32
  uint64 time_in_state_ms = 4;       // wire: 64 bits, INFERRED: unsigned
  uint32 rx_bytes = 5;               // wire: u32
  uint32 rx_packets = 6;             // wire: u32
  uint32 rx_backpressure_drops = 7;  // wire: u32
  uint32 rx_bad_packet_drops = 8;    // wire: u32
  uint32 tx_bytes = 9;               // wire: u32
  uint32 tx_packets = 10;            // wire: u32
  uint32 battery_voltage_mv = 11;    // wire: 16 bits, INFERRED: unsigned
  sint32 battery_current_ma = 12;    // wire: 16 bits, INFERRED: signed (charge vs discharge)
  uint32 solar_voltage_mv = 13;      // wire: 16 bits, legacy alias of panel A, INFERRED: mV, unsigned
  uint32 solar_current_ma = 14;      // wire: 16 bits, legacy alias of panel A, INFERRED: mA, unsigned
  uint32 panel_a_voltage_mv = 15;    // wire: 16 bits, INFERRED: mV, unsigned
  uint32 panel_a_current_ma = 16;    // wire: 16 bits, INFERRED: mA, unsigned
  uint32 panel_b_voltage_mv = 17;    // wire: 16 bits, INFERRED: mV, unsigned
  uint32 panel_b_current_ma = 18;    // wire: 16 bits, INFERRED: mA, unsigned
  BeaconStatus status = 19;          // wire: u8
  BeaconAdcs adcs = 20;
  string callsign = 21;              // wire: 6 bytes, "KC3WNY"
}

/**
 * Reply to a command, e.g. PING/NO_OP answers with
 * "Number of commands processed: %d". The spec flags this format as one that
 * should change, so it is kept as text rather than parsed.
 */
message CommandResponse {
  string text = 1;  // wire: null terminated string after the COMMAND_RESPONSE id byte
}

message RxPacket {
  AbstractPacket packet = 1;
  oneof payload {
    Beacon beacon = 2;
    CommandResponse command_response = 3;
    bytes ftp = 4;  // INFERRED: FTP format lives in a separate doc, left raw until it is modelled
  }
}

/* ---------------------------------------------------------------------------
 * TX: ground station -> SAMWISE
 *
 * On the wire, the first byte of data is the command id and the rest is the
 * command's arguments. The oneof field numbers below are NOT those ids; the
 * ids are defined by flight software.
 * ------------------------------------------------------------------------ */

message Ping {}             // no arguments
message PayloadTurnOn {}    // no arguments
message PayloadTurnOff {}   // no arguments
message PayloadShutdown {}  // no arguments; behaviour still being planned in samwise-flight-software#313

/**
 * INFERRED: the spec sends the state as a string. It is an enum here so only
 * known states can be built; the comments give the string each maps to.
 */
enum SatState {
  SAT_STATE_UNSPECIFIED = 0;
  SAT_STATE_RUNNING = 1;          // "running_state"
  SAT_STATE_INIT = 2;             // "init_state"
  SAT_STATE_BURN_WIRE = 3;        // "burn_wire"
  SAT_STATE_BURN_WIRE_RESET = 4;  // "burn_wire_reset_state"
}

/* Force SAMWISE into a state. */
message ManualStateOverride {
  SatState state = 1;  // wire: null terminated string, up to 208 bytes + terminator
}

/**
 * Forward a command to the payload over UART. On the wire this is the JSON
 * string ["command_name", [args], {kwargs}].
 */
message PayloadExec {
  string command_name = 1;  // a key of NAMES_TO_COMMANDS in payload/commands.py
  string args_json = 2;     // INFERRED: JSON array, kept as text since args are untyped
  string kwargs_json = 3;   // INFERRED: JSON object, kept as text since kwargs are untyped
}

/**
 * One byte relayed by picubed to the ADCS board. The spec lists this under
 * RX, but it is sent from the ground, so it is modelled as TX.
 */
message AdcsCommand {
  uint32 command = 1;  // wire: u8, 0 to 127
}

message TxPacket {
  AbstractPacket packet = 1;
  bytes hmac = 2;  // wire: 32 bytes, SHA-256 HMAC, only checked on SAMWISE
  oneof command {
    Ping ping = 3;
    ManualStateOverride manual_state_override = 4;
    PayloadTurnOn payload_turn_on = 5;
    PayloadTurnOff payload_turn_off = 6;
    PayloadShutdown payload_shutdown = 7;
    PayloadExec payload_exec = 8;
    AdcsCommand adcs_command = 9;
    bytes ftp = 10;  // INFERRED: FTP format lives in a separate doc, left raw until it is modelled
  }
  // The ADCS file packet is unimplemented and its format (JSON/YAML) undecided.
}
