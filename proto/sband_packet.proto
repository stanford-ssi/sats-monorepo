syntax = "proto3";

/**
 * 2400 MHz (S-band) link, payload -> ground station only.
 *
 * Source: Ground Station Specification Sheet, section 3. The link currently
 * only downlinks payload images as SSDV packets.
 *
 * These messages are the decoded form of an SSDV packet, not its byte
 * layout; the "wire:" comments record each field's width there. Fields
 * marked INFERRED have a type or meaning the spec does not state outright.
 */
package sats.sband;

/* Byte 1 of an SSDV packet. */
enum PacketType {
  PACKET_TYPE_UNSPECIFIED = 0;
  PACKET_TYPE_NORMAL = 102;  // 0x66: 224 byte packet + 32 byte FEC
  PACKET_TYPE_NO_FEC = 103;  // 0x67: 256 byte packet
}

/* The xx bits of the flags byte. */
enum SubsamplingMode {
  SUBSAMPLING_MODE_2X2 = 0;
  SUBSAMPLING_MODE_1X2 = 1;
  SUBSAMPLING_MODE_2X1 = 2;
  SUBSAMPLING_MODE_1X1 = 3;
}

/* Flags byte, laid out as 00qqqexx. */
message SsdvFlags {
  uint32 jpeg_quality = 1;              // wire: 3 bits, stored XOR 4; INFERRED: holds the decoded 0-7 level
  bool eoi = 2;                         // wire: 1 bit, set on the last packet of an image
  SubsamplingMode subsampling = 3;      // wire: 2 bits
}

message RxPacket {
  // The 0x55 sync byte at offset 0 is a constant and is not stored.
  PacketType packet_type = 1;
  string callsign = 2;     // wire: 4 bytes base-40; INFERRED: holds the decoded string, up to 6 chars
  uint32 image_id = 3;     // wire: u8
  uint32 packet_id = 4;    // wire: u16, big endian
  uint32 width = 5;        // wire: u8, in 16 px MCU blocks, 0 = invalid
  uint32 height = 6;       // wire: u8, in 16 px MCU blocks, 0 = invalid
  SsdvFlags flags = 7;     // wire: u8
  uint32 mcu_offset = 8;   // wire: u8, 0xFF if no MCU starts in this packet
  uint32 mcu_index = 9;    // wire: u16, big endian, 0xFFFF if none
  bytes payload = 10;      // wire: 205 bytes (normal) or 237 bytes (no-FEC)
  uint32 checksum = 11;    // wire: u32, CRC32
  bytes fec = 12;          // wire: 32 bytes Reed-Solomon, normal mode only
}
